# Builds the executables on GitHub's own machines so nobody needs Python installed:
#  - "Run workflow" in the Actions tab (or push a tag like v0.1.0) builds the
#    Windows .exe, macOS .dmg files (Apple Silicon + Intel) and a Linux binary.
#  - Download them from the workflow run's "Artifacts" section, or from the
#    Release page when a version was typed into the box / a tag was pushed.
name: Build executables

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional: version to publish as a GitHub Release, e.g. v0.1.2 (leave blank to only produce artifacts)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            pattern: release/*.exe
          - os: macos-latest        # Apple Silicon
            artifact: macos-arm64
            pattern: release/*.dmg
          - os: macos-15-intel      # Intel Macs; optional so a runner shortage cannot block the release
            artifact: macos-x64
            pattern: release/*.dmg
            optional: true
          - os: ubuntu-22.04   # oldest supported runner: the binary needs this glibc (2.35) or newer
            artifact: linux
            pattern: release/rsa-*-linux-*.tar.gz
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,build]"
      - run: python -m pytest -q
      - name: Stamp the version from the release tag
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        shell: bash
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          # The executable reports this version (rsa --version) and it is in the file name.
          python scripts/set_version.py "$TAG"
      - name: Build
        run: python scripts/build_exe.py
      - name: Smoke-test the executable (full offline demo run)
        shell: bash
        run: |
          set -e
          if [ "$RUNNER_OS" = "Windows" ]; then exe=release/rsa.exe; else exe=release/rsa; fi
          "$exe" --version
          "$exe" demo --data-dir smoke/data --out smoke/out --leagues epl,mls
          test -f smoke/out/report.md
          head -20 smoke/out/report.md
      - name: Package as .dmg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          bin=$(ls release/rsa-*-macos-* | grep -v -E '\.(dmg|tar\.gz)$' | head -1)
          name=$(basename "$bin")
          stage="$(mktemp -d)/Robinhood Soccer Analyzer"
          mkdir -p "$stage"
          cp "$bin" "$stage/rsa"
          chmod +x "$stage/rsa"
          # Double-clickable launcher: .command files open in Terminal.
          cat > "$stage/Run Robinhood Soccer Analyzer.command" <<'LAUNCHER'
          #!/bin/bash
          cd "$(dirname "$0")"
          xattr -d com.apple.quarantine ./rsa 2>/dev/null || true
          ./rsa
          LAUNCHER
          chmod +x "$stage/Run Robinhood Soccer Analyzer.command"
          cat > "$stage/README.txt" <<'NOTE'
          Robinhood Soccer Analyzer (macOS)

          1. Drag this folder anywhere (e.g. Applications or your Desktop).
          2. Double-click "Run Robinhood Soccer Analyzer.command". A Terminal window opens with the menu.
             If macOS says it cannot verify the developer: System Settings > Privacy & Security > "Open Anyway",
             then double-click it again. Or, in Terminal:  xattr -d com.apple.quarantine rsa && ./rsa
          3. Reports are written to a "reports" folder next to the program.

          Command line: ./rsa --help
          NOTE
          hdiutil create -volname "Robinhood Soccer Analyzer" -srcfolder "$stage" -ov -format UDZO "release/$name.dmg"
          ls -la release
      - name: Package as .tar.gz (Linux keeps the executable bit only inside an archive)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd release
          for f in rsa-*-linux-*; do
            case "$f" in *.tar.gz) continue;; esac
            tar czf "$f.tar.gz" "$f"
          done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: robinhood-soccer-analyzer-${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  # Publish once, and only when every platform built: a Windows-only failure must not
  # leave a Release with no .exe on it.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: robinhood-soccer-analyzer-*
          merge-multiple: true
          path: release
      - run: ls -la release
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Robinhood Soccer Analyzer ${{ inputs.release_tag || github.ref_name }}
          files: |
            release/rsa-*.exe
            release/rsa-*.dmg
            release/rsa-*.tar.gz
