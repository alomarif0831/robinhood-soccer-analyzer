# Builds the executables on GitHub's own machines so nobody needs Python installed:
#  - "Run workflow" in the Actions tab (or push a tag like v0.1.0) builds the
#    Windows .exe files (the Robinhood Soccer HQ app + the rsa CLI), macOS .dmg files
#    (Apple Silicon + Intel, each with "Robinhood Soccer HQ.app") and Linux binaries.
#  - Download them from the workflow run's "Artifacts" section, or from the
#    Release page when a version was typed into the box / a tag was pushed.
name: Build executables

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional: version to publish as a GitHub Release, e.g. v0.1.2 (leave blank to only produce artifacts)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            pattern: release/*.exe
          - os: macos-latest        # Apple Silicon
            artifact: macos-arm64
            pattern: release/*.dmg
          - os: macos-15-intel      # Intel Macs; optional so a runner shortage cannot block the release
            artifact: macos-x64
            pattern: release/*.dmg
            optional: true
          - os: ubuntu-22.04   # oldest supported runner: the binary needs this glibc (2.35) or newer
            artifact: linux
            pattern: release/*-linux-*.tar.gz
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,build]"
      - run: python -m pytest -q
      - name: Stamp the version from the release tag
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        shell: bash
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          # The executable reports this version (rsa --version) and it is in the file name.
          python scripts/set_version.py "$TAG"
      - name: Build
        run: python scripts/build_exe.py
      - name: Smoke-test the executable (full offline demo run)
        shell: bash
        run: |
          set -e
          if [ "$RUNNER_OS" = "Windows" ]; then exe=release/rsa.exe; gui=release/RobinhoodSoccerHQ.exe; else exe=release/rsa; gui=release/RobinhoodSoccerHQ; fi
          "$exe" --version
          "$exe" demo --data-dir smoke/data --out smoke/out --leagues epl,mls
          test -f smoke/out/report.md && test -f smoke/out/picks.md
          head -20 smoke/out/report.md
          RSA_HOME=smoke/home "$gui" hq --smoke
      - name: Package as .dmg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          cli=$(ls release/rsa-*-macos-* | grep -v -E '\.(dmg|tar\.gz)$' | head -1)
          gui=$(ls release/RobinhoodSoccerHQ-*-macos-* | grep -v -E '\.(dmg|tar\.gz)$' | head -1)
          name=$(basename "$gui")
          stage="$(mktemp -d)/Robinhood Soccer HQ"
          mkdir -p "$stage"
          cp -R "release/Robinhood Soccer HQ.app" "$stage/"
          cp "$cli" "$stage/rsa"
          chmod +x "$stage/rsa"
          cat > "$stage/README.txt" <<'NOTE'
          Robinhood Soccer HQ (macOS)

          1. Drag "Robinhood Soccer HQ.app" into Applications (or anywhere).
          2. Open it. The app starts a local server and opens the HQ window in Chrome/Edge (app mode) or your default browser.
             If macOS says it cannot verify the developer: System Settings > Privacy & Security > "Open Anyway",
             then open it again. Or, in Terminal:  xattr -dr com.apple.quarantine "Robinhood Soccer HQ.app"
          3. Your data and reports live in ~/.robinhood-soccer-hq (shown in the app's Settings).

          "rsa" next to the app is the command-line version: ./rsa --help
          NOTE
          hdiutil create -volname "Robinhood Soccer HQ" -srcfolder "$stage" -ov -format UDZO "release/$name.dmg"
          ls -la release
      - name: Package as .tar.gz (Linux keeps the executable bit only inside an archive)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd release
          for f in rsa-*-linux-* RobinhoodSoccerHQ-*-linux-*; do
            case "$f" in *.tar.gz) continue;; esac
            tar czf "$f.tar.gz" "$f"
          done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: robinhood-soccer-hq-${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  # Publish once, and only when every platform built: a Windows-only failure must not
  # leave a Release with no .exe on it.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: robinhood-soccer-hq-*
          merge-multiple: true
          path: release
      - run: ls -la release
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Robinhood Soccer HQ ${{ inputs.release_tag || github.ref_name }}
          files: |
            release/RobinhoodSoccerHQ-*.exe
            release/rsa-*.exe
            release/RobinhoodSoccerHQ-*.dmg
            release/RobinhoodSoccerHQ-*.tar.gz
            release/rsa-*.tar.gz
