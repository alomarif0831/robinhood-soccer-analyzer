[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robinhood-soccer-hq"
version = "0.2.0"
description = "Robinhood Soccer HQ: backtest Robinhood/Kalshi soccer contracts against real results and rank upcoming bets by confidence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
auth = ["cryptography>=41"]
dev = ["pytest>=7"]
build = ["pyinstaller>=6.10"]

[project.scripts]
rsa = "rsa.cli:main"
soccer-hq = "rsa.cli:main"

[tool.setuptools]
packages = ["rsa", "rsa.hq"]

[tool.setuptools.package-data]
rsa = ["hq/ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
