[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robinhood-soccer-analyzer"
version = "0.1.0"
description = "Backtest Robinhood/Kalshi soccer prediction-market prices against match results to look for a betting edge."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
]

[project.optional-dependencies]
auth = ["cryptography>=41"]
dev = ["pytest>=7"]

[project.scripts]
rsa = "rsa.cli:main"

[tool.setuptools]
packages = ["rsa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
